[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pensieve"
version = "0.1.0"
description = "LLM-maintained personal knowledge wiki tool"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "click>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.scripts]
pensieve = "pensieve.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
